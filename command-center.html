<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b0d" />
    <title>Drive & Shine | Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="command-center.css" />
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="command-center.js" defer></script>
    <script src="command-center-events.js" defer></script>
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand-lockup" href="#dashboard" data-page="dashboard" aria-label="Drive and Shine Command Center"><img src="images/logo.png" alt="Drive & Shine" /><span class="brand-caption">Command Center</span></a>
        <nav class="side-nav" id="sideNav">
          <a class="nav-item active" href="#dashboard" data-page="dashboard"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
          <a class="nav-item" href="#bookings" data-page="bookings"><i data-lucide="calendar-check-2"></i><span>Bookings</span><b class="nav-count">5</b></a>
          <a class="nav-item" href="#calendar" data-page="calendar"><i data-lucide="calendar-days"></i><span>Calendar</span></a>
          <a class="nav-item" href="#customers" data-page="customers"><i data-lucide="users-round"></i><span>Customers</span></a>
          <a class="nav-item" href="#inventory" data-page="inventory"><i data-lucide="boxes"></i><span>Inventory</span><b class="nav-count alert-count">3</b></a>
          <a class="nav-item" href="#memberships" data-page="memberships"><i data-lucide="shield-check"></i><span>Memberships</span></a>
          <a class="nav-item" href="#payments" data-page="payments"><i data-lucide="credit-card"></i><span>Payments</span></a>
          <a class="nav-item" href="#reports" data-page="reports"><i data-lucide="chart-no-axes-combined"></i><span>Reports</span></a>
          <a class="nav-item" href="#profile" data-page="profile"><i data-lucide="contact-round"></i><span>Profile</span></a>
          <a class="nav-item notification-nav" href="#notifications" data-page="notifications"><i data-lucide="bell-ring"></i><span>Notifications</span><b class="nav-count gold-count" id="sideNotificationCount">8</b></a>
        </nav>
        <div class="plan-card"><span class="plan-icon"><i data-lucide="crown"></i></span><p>You’re on</p><strong>Gold Plan</strong><button type="button" data-open-modal="plan"><span>Manage Plan</span><i data-lucide="chevron-right"></i></button></div>
        <p class="sidebar-copyright">© 2024 Drive &amp; Shine<br />All rights reserved.</p>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="topbar-left"><button class="icon-button menu-button" id="sidebarToggle" aria-label="Collapse sidebar"><i data-lucide="menu"></i></button><label class="global-search"><i data-lucide="search"></i><input id="globalSearch" type="search" placeholder="Search anything..." autocomplete="off" /><kbd>Ctrl + K</kbd></label></div>
          <div class="topbar-actions">
            <div class="theme-switch" aria-label="Theme controls"><button type="button" id="lightMode" aria-label="Use light theme"><i data-lucide="sun"></i></button><button type="button" class="active" id="darkMode" aria-label="Use dark theme"><i data-lucide="moon"></i></button></div>
            <div class="notification-wrap"><button class="icon-button bell-button" id="notificationBell" aria-label="Show notifications"><i data-lucide="bell"></i><b id="notificationBadge">8</b></button><div class="notification-popover" id="notificationPopover"><div class="popover-head"><strong>Notifications</strong><button type="button" id="markAllRead">Mark all read</button></div><div id="popoverNotifications"></div><button class="popover-footer" type="button" data-page="notifications">View all notifications <i data-lucide="arrow-right"></i></button></div></div>
            <div class="profile-menu-wrap"><button class="profile-trigger" id="profileTrigger" type="button" aria-expanded="false"><span class="avatar avatar-main">AM</span><span class="profile-copy"><b>Admin</b><small>Super Admin</small></span><i data-lucide="chevron-down"></i></button><div class="profile-menu" id="profileMenu"><button type="button" data-page="profile"><i data-lucide="user-round"></i>My profile</button><button type="button" id="logoutButton"><i data-lucide="log-out"></i>Log out</button></div></div>
          </div>
        </header>
        <main id="pageRoot" class="page-root" tabindex="-1"></main>
      </div>
    </div>
    <div class="command-palette" id="commandPalette" aria-hidden="true"><div class="command-panel" role="dialog" aria-modal="true" aria-label="Search command center"><div class="command-search"><i data-lucide="search"></i><input id="paletteSearch" placeholder="Search pages, customers, bookings..." /><kbd>Esc</kbd></div><div class="command-results" id="commandResults"></div></div></div>
    <div class="modal-overlay" id="modalOverlay" aria-hidden="true"><section class="form-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-header"><div><p class="eyebrow" id="modalEyebrow">Create record</p><h2 id="modalTitle">New booking</h2></div><button class="close-button" type="button" id="closeModal" aria-label="Close dialog"><i data-lucide="x"></i></button></div><form id="recordForm" novalidate></form></section></div>
    <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
